<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Apeiron Buvette</title>
  <meta name="description" content="Consultez notre menu et passez votre commande en ligne.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🍺</text></svg>">
  <link rel="stylesheet" href="css/global.css">
  <style>
    :root { 
      --theme: #f0a500; 
      --gold-glow: rgba(240,165,0,0.4);
      --bg-deep: #030305;
      --glass: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.08);
    }
    
    body { 
      background: var(--bg-deep); 
      color: #fff;
      font-family: var(--font-b);
      overflow-x: hidden;
      margin: 0;
    }

    /* ── Cinematic Mesh Background ── */
    .mesh-bg {
      position: fixed; inset: 0; z-index: -1;
      background: 
        radial-gradient(circle at 0% 0%, rgba(240,165,0,0.1) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(232,93,4,0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(15,15,25,1) 0%, #000 100%);
    }
    .mesh-bg::after {
      content: ''; position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.04; mix-blend-mode: overlay;
    }

    /* ── Futuristic Header ── */
    .mn-header { padding: 5rem 1.5rem 3rem; text-align: center; position: relative; }
    .mn-logo-container {
      position: relative; width: 120px; height: 120px; margin: 0 auto 2rem;
    }
    .mn-logo-glow {
      position: absolute; inset: -15px; border-radius: 50%;
      background: var(--gold-glow); filter: blur(30px); opacity: 0.6;
      animation: pulseGlow 4s infinite alternate;
    }
    .mn-logo-wrap {
      position: relative; width: 100%; height: 100%; border-radius: 50%;
      background: var(--glass); border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px); padding: 6px; box-sizing: border-box;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    .mn-logo-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    
    .mn-name { 
      font-family: var(--font-d); font-size: 3rem; font-weight: 900; letter-spacing: -0.04em;
      background: linear-gradient(180deg, #fff 0%, #aaa 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0; line-height: 1.1;
    }
    .mn-slogan { 
      font-size: 0.8rem; color: var(--gold); font-weight: 700; margin-top: 0.75rem; 
      letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.7; 
    }

    /* ── Neuro-Pill Navigator ── */
    .bi-tabs {
      display: flex; gap: 0.5rem; padding: 8px; margin: 0 2rem;
      background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border);
      border-radius: var(--r-full); backdrop-filter: blur(40px);
      position: sticky; top: 1.5rem; z-index: 150;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }
    .bi-tab {
      flex: 1; padding: 0.85rem 1.5rem; border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center; gap: 0.8rem;
      cursor: pointer; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      color: rgba(255,255,255,0.3); font-weight: 800; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .bi-tab.active {
      background: #fff; color: #000;
      box-shadow: 0 10px 25px rgba(255,255,255,0.2);
    }
    .bi-tab.active .tab-label { color: #000; }
    .bi-tab .tab-icon { font-size: 1.5rem; transition: transform 0.4s; }
    .bi-tab.active .tab-icon { transform: scale(1.1) rotate(-10deg); }

    /* ── Holographic Product Cards ── */
    .cat-section { padding: 3rem 1.5rem; }
    .client-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }

    .mn-card {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 2.5rem; padding: 2.5rem 1.5rem;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1); position: relative;
      backdrop-filter: blur(25px); overflow: hidden;
    }
    .mn-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 50%);
      opacity: 0.5;
    }
    .mn-card:hover { 
      transform: translateY(-15px) scale(1.03); 
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 30px rgba(240,165,0,0.15);
    }
    .mn-card.in-cart { border-color: var(--theme); background: rgba(240,165,0,0.08); }
    
    .mn-cap { 
      width: 100px; height: 100px; margin-bottom: 1.5rem; 
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6)); 
      transition: transform 0.5s;
    }
    .mn-card:hover .mn-cap { transform: rotate(10deg) scale(1.1); }
    
    .mn-photo { 
      width: 110px; height: 110px; border-radius: 2rem; object-fit: cover; 
      margin-bottom: 1.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .mn-pname { 
      font-family: var(--font-d); font-size: 1.2rem; font-weight: 800; color: #fff; 
      margin-bottom: 0.6rem; letter-spacing: -0.02em; 
    }
    .mn-pprice { 
      font-family: var(--font-d); font-size: 1.4rem; font-weight: 900; color: var(--theme); 
      text-shadow: 0 0 15px var(--gold-glow);
    }
    .mn-pdesc { 
      font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 1rem; 
      line-height: 1.7; font-weight: 500;
    }

    .mn-qty {
      position: absolute; top: 1.5rem; right: 1.5rem; background: var(--theme); color: #000;
      width: 28px; height: 28px; border-radius: 50%; font-size: 0.85rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center; transform: scale(0);
      transition: transform 0.4s var(--ease-spring); box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      z-index: 5;
    }
    .mn-qty.show { transform: scale(1); }

    /* ── Floating Controls ── */
    .mn-search-wrap { 
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 170; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .mn-search-wrap.cart-up { bottom: 7.5rem; }
    .mn-search {
      background: rgba(10, 10, 15, 0.95); border: 1px solid var(--glass-border);
      padding: 1rem 2rem; border-radius: var(--r-full); color: #fff;
      width: 200px; text-align: center; outline: none; transition: all 0.5s;
      font-size: 0.9rem; backdrop-filter: blur(30px); font-weight: 600;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .mn-search:focus { width: 300px; border-color: var(--theme); box-shadow: 0 0 30px var(--gold-glow); }

    .fab-special {
      position: fixed; bottom: 2rem; right: 2rem;
      padding: 0.8rem 1.8rem; border-radius: var(--r-full);
      background: #fff; color: #000;
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      font-size: 0.9rem; font-weight: 800; cursor: pointer; z-index: 180;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); border: 2px solid transparent;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .fab-special.cart-up { bottom: 7.5rem; }
    .fab-special:hover { transform: scale(1.05) translateY(-5px); border-color: var(--theme); }
    .fab-special::before { content: '✨'; font-size: 1.2rem; }

    /* ── Subspace UI Components ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(25px);
      z-index: 300; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: all 0.6s var(--ease);
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    
    .modal {
      background: rgba(10, 10, 15, 0.98); border: 1px solid var(--glass-border);
      width: 90%; max-width: 480px; border-radius: 3rem; padding: 3.5rem;
      transform: translateY(40px) scale(0.95); transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 50px 100px rgba(0,0,0,0.9);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-title { font-family: var(--font-d); font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 2rem; }
    
    .form-input {
      background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
      border-radius: 1.5rem; padding: 1.25rem 1.5rem; color: #fff; width: 100%;
      font-family: var(--font-b); font-size: 1rem; transition: all 0.4s;
      box-sizing: border-box;
    }
    .form-input:focus { border-color: var(--theme); background: rgba(255,255,255,0.06); outline: none; }

    .cart-bar {
      position: fixed; bottom: 2rem; left: 1.5rem; right: 1.5rem;
      background: #fff; color: #000;
      border-radius: var(--r-full); padding: 0.9rem 1.8rem;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      transform: translateY(200%); transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
      z-index: 200;
    }
    .cart-bar.vis { transform: translateY(0); }
    .cart-info { display: flex; align-items: center; gap: 1rem; }
    .cart-bubble {
      background: var(--theme); color: #000; font-weight: 900;
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
    }
    .cart-total { font-family: var(--font-d); font-weight: 900; font-size: 1.5rem; color: #000; }
    
    .cart-item-row { display: flex; align-items: center; gap: 1.25rem; padding: 1.25rem 0; border-bottom: 1px solid var(--glass-border); }
    .cart-item-name { flex: 1; font-weight: 700; font-size: 1rem; color: #fff; }
    .qty-ctrl { display: flex; align-items: center; gap: 0.8rem; background: rgba(255,255,255,0.05); padding: 0.4rem 0.8rem; border-radius: var(--r-full); }
    .qty-btn { cursor: pointer; font-weight: 900; font-size: 1.2rem; color: var(--gold); }
    .qty-num { min-width: 1.5rem; text-align: center; font-weight: 800; font-family: var(--font-d); }

    /* Staggered Reveal */
    @keyframes revealCard {
      from { opacity: 0; transform: translateY(30px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .mn-card { animation: revealCard 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
    
    /* Animations */
    @keyframes pulseGlow { 
      from { opacity: 0.4; transform: scale(0.9); } 
      to { opacity: 0.8; transform: scale(1.1); } 
    }

    .sub-tabs {
      display: flex; gap: 0.75rem; overflow-x: auto; padding: 0.5rem 2rem;
      scrollbar-width: none; -ms-overflow-style: none;
      margin-top: 1.5rem;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab {
      padding: 0.6rem 1.25rem; border-radius: var(--r-full);
      background: var(--glass); border: 1px solid var(--glass-border);
      color: rgba(255,255,255,0.5); font-size: 0.85rem; font-weight: 700;
      white-space: nowrap; cursor: pointer; transition: all 0.4s;
      backdrop-filter: blur(10px);
    }
    .sub-tab.active {
      background: var(--theme); color: #000; border-color: var(--theme);
      box-shadow: 0 5px 15px var(--gold-glow);
    }

    #menuProducts { padding-bottom: 12rem; }
  </style>
</head>
<body class="gradient-bg">

<div class="mesh-bg"></div>
<div id="loader">
  <div class="loader-spin"></div>
  <div class="loader-text">Apeiron Buvette</div>
</div>

<!-- ══ ERROR (buvette not found) ══ -->
<div id="errPage" style="display:none;text-align:center;padding:4rem 2rem;">
  <div style="font-size:3rem;margin-bottom:1rem;">🍺</div>
  <div style="font-family:var(--font-d);font-size:1.3rem;font-weight:700;margin-bottom:.5rem;">Buvette introuvable</div>
  <p style="color:var(--text-secondary);font-size:.9rem;">Le lien est incorrect ou la buvette n'existe plus.</p>
</div>

<!-- ══ MENU MODE ══ -->
<div id="menuMode" style="display:none;">

  <!-- Header -->
  <div class="mn-header" id="mnHeader">
    <div class="mn-logo-container">
      <div class="mn-logo-glow"></div>
      <div class="mn-logo-wrap" id="mnLogoWrap"></div>
    </div>
    <div class="mn-name" id="mnName"></div>
    <div class="mn-slogan" id="mnSlogan"></div>
    <div class="mn-info" id="mnInfo"></div>
  </div>

  <div id="mnCatTabs" class="bi-tabs"></div>
  <div id="mnSubTabs" class="sub-tabs"></div>

  <div class="mn-search-wrap" id="mnSearchWrap">
    <input type="text" id="mnSearch" class="mn-search" placeholder="🔍 Rechercher..." oninput="handleSearch()">
  </div>

  <!-- Products -->
  <div id="menuProducts"></div>

  <!-- FAB for Special Request -->
  <button class="fab-special" id="fabSpecial" onclick="openSpecialModal('drinks')">Demande Spéciale</button>

  <!-- Cart bar -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-info">
      <div class="cart-bubble" id="cartCount">0</div>
      <div>
        <div class="cart-lbl">Mon panier</div>
        <div class="cart-items-lbl" id="cartItemsLbl"></div>
      </div>
    </div>
    <div class="cart-total" id="cartTotalDisplay">0</div>
    <button class="btn btn-primary btn-sm" onclick="openCart()">Voir →</button>
  </div>
</div>

<!-- ══ STATUS MODE (order tracking) ══ -->
<div id="statusMode" style="display:none;">
  <div class="status-page">
    <div class="status-anim s-pending" id="sAnim">⏳</div>
    <div class="s-title" id="sTitle">Commande envoyée !</div>
    <p class="s-sub" id="sSub">Votre commande <span class="s-order-num" id="sNum"></span> a été reçue.</p>
    <div class="s-items-recap" id="sRecap"></div>
    <div id="sActions" style="display:flex;flex-direction:column;gap:.75rem;align-items:center;margin-top:1rem;"></div>
    <button class="btn btn-ghost btn-sm" style="margin-top:1.25rem;" onclick="backToMenu()">← Retour au menu</button>
  </div>
</div>

<!-- ══ MODAL: Cart ══ -->
<div class="modal-overlay" id="cartModal">
  <div class="modal" style="max-width:500px;">
    <div class="modal-hdr">
      <span class="modal-title">🛒 Mon Panier</span>
      <button class="modal-close" onclick="closeModal('cartModal')">✕</button>
    </div>
    <div id="cartItemList"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-top:1px solid var(--border);margin-top:.5rem;">
      <span style="font-family:var(--font-d);font-weight:700;">Total</span>
      <span style="font-family:var(--font-d);font-weight:800;font-size:1.2rem;color:var(--theme);" id="cartModalTotal"></span>
    </div>
    <div class="divider"></div>
    <div class="form-grid" style="gap:.9rem;">
      <div class="form-group">
        <label class="form-label">Mode de consommation <span class="req">*</span></label>
        <div style="display:flex; gap:.5rem;">
          <button class="btn btn-secondary" id="btnSurPlace" style="flex:1; border-color:var(--border-gold); background:rgba(240,165,0,.08);" onclick="setOrderMode('Sur Place')">🍽️ Sur place</button>
          <button class="btn btn-ghost" id="btnEmporter" style="flex:1; border:1px solid var(--border);" onclick="setOrderMode('À emporter')">🛍️ À emporter</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Votre prénom / surnom <span class="req">*</span></label>
        <input id="clientName" class="form-input" type="text" placeholder="Ex: Jean">
      </div>
      <div class="form-group" id="grpTable">
        <label class="form-label">Table / Référence <span class="req">*</span></label>
        <input id="clientTable" class="form-input" type="text" placeholder="Ex: Table 5, Terrasse B">
      </div>
    </div>
    <div class="form-error" id="orderErr" style="margin-top:.75rem;font-size:.86rem;"></div>
    <button class="btn btn-primary btn-lg" style="width:100%;margin-top:1.25rem;" id="sendOrderBtn" onclick="sendOrder()">🚀 Envoyer la commande</button>
  </div>
</div>

<!-- ══ MODAL: Special Request ══ -->
<div class="modal-overlay" id="specialModal">
  <div class="modal" style="max-width:500px;">
    <div class="modal-hdr" style="margin-bottom:2.5rem;display:flex;justify-content:space-between;align-items:center;">
      <span class="modal-title" style="margin:0;">✨ Demande Spéciale</span>
      <button class="modal-close" style="background:var(--glass);border:1px solid var(--glass-border);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;" onclick="closeModal('specialModal')">✕</button>
    </div>
    
    <div class="segmented" style="display:flex;background:rgba(255,255,255,0.05);padding:6px;border-radius:var(--r-full);margin-bottom:2rem;">
      <button class="seg-btn active" id="segDrinks" style="flex:1;padding:1rem;border-radius:var(--r-full);border:none;background:transparent;color:rgba(255,255,255,0.4);font-weight:800;cursor:pointer;transition:0.3s;" onclick="setSpecialType('drinks')">🍸 Boisson</button>
      <button class="seg-btn" id="segFood" style="flex:1;padding:1rem;border-radius:var(--r-full);border:none;background:transparent;color:rgba(255,255,255,0.4);font-weight:800;cursor:pointer;transition:0.3s;" onclick="setSpecialType('food')">🍴 Nourriture</button>
    </div>

    <div class="form-group">
      <textarea id="specialText" class="form-input" 
        style="height:160px;resize:none;background:rgba(0,0,0,0.3);border:1px solid var(--glass-border);border-radius:2rem;padding:1.5rem;color:#fff;font-size:1.1rem;line-height:1.6;" 
        placeholder="Que pouvons-nous préparer pour vous ?"></textarea>
      <p style="font-size:0.8rem;color:rgba(255,255,255,0.3);margin-top:1.25rem;text-align:center;font-weight:500;">
        💡 Précisez vos ingrédients ou préférences. <br>Le prix sera ajusté par le barman.
      </p>
    </div>

    <button class="btn btn-primary btn-lg" 
      style="width:100%;margin-top:2rem;padding:1.25rem;border-radius:var(--r-full);background:#fff;color:#000;border:none;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;box-shadow:0 15px 30px rgba(255,255,255,0.1);" 
      onclick="addSpecialToCart()">🚀 Ajouter au Panier</button>
  </div>
</div>

<div class="toast-box" id="toastBox"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase.js"></script>

<script src="js/auth_v2.js"></script>
<script src="js/drinks-gallery.js"></script>
<script src="js/products.js"></script>
<script src="js/orders.js"></script>
<script src="js/pdf.js"></script>

<script>
/* ══ INIT (async — syncs from Firebase first) ════════════ */
const params = new URLSearchParams(location.search);
let BID      = params.get('buvette');
let buvette  = null;
let activeOrderId = null;
let orderMode = 'Sur Place';

async function initMenu() {
  try {
    // 0. Show skeletons immediately
    renderSkeletons();

    // 1. Sync buvette accounts from Firebase
    await AUTH.syncFromFirebase();

    // 2. Determine BID
    if (!BID) {
      const logged = AUTH.getCurrentBuvette();
      if (logged) BID = logged.id;
    }

    buvette = BID ? await AUTH.getBuvetteById(BID) : null;

    if (!buvette) {
      const ldr = document.getElementById('loader');
      if (ldr) { ldr.style.opacity = '0'; setTimeout(() => ldr.style.display = 'none', 500); }
      document.getElementById('errPage').style.display = 'block';
      return;
    }

    // 2.1 Trial Check (14 days)
    const created = new Date(buvette.createdAt || Date.now());
    const daysDiff = (Date.now() - created.getTime()) / (1000 * 60 * 60 * 24);
    if (daysDiff > 14 && !buvette.isPremium) {
      const ldr = document.getElementById('loader');
      if (ldr) { ldr.style.opacity = '0'; setTimeout(() => ldr.style.display = 'none', 500); }
      const ep = document.getElementById('errPage');
      ep.style.display = 'block';
      ep.innerHTML = `
        <div style="font-size:3rem;margin-bottom:1rem;">⏳</div>
        <div style="font-family:var(--font-d);font-size:1.3rem;font-weight:700;margin-bottom:.5rem;">Menu temporairement indisponible</div>
        <p style="color:var(--text-secondary);font-size:.9rem;">L'accès à ce menu a expiré. Veuillez contacter l'établissement pour plus d'informations.</p>
      `;
      return;
    }

  // 3. Sync products from Firebase
  await PRODUCTS.syncFromFirebase(BID);
  await ORDERS.syncFromFirebase(BID);

  // 4. Restore pending order
  activeOrderId = sessionStorage.getItem(`apeiron_order_${BID}`) || null;

  // 5. Render
  init();

  // 6. Real-time updates
  PRODUCTS.listen(BID, () => buildMenu());

  } catch (err) {
    console.error("Init error:", err);
    toast("Erreur de synchronisation. Veuillez rafraîchir.", "error");
  }
}

initMenu();

function setOrderMode(mode) {
  orderMode = mode;
  const isSurPlace = (mode === 'Sur Place');
  const btnSP = document.getElementById('btnSurPlace');
  const btnEM = document.getElementById('btnEmporter');
  if (btnSP && btnEM) {
    btnSP.className = isSurPlace ? 'btn btn-secondary' : 'btn btn-ghost';
    btnSP.style.borderColor = isSurPlace ? 'var(--border-gold)' : 'var(--border)';
    btnSP.style.background = isSurPlace ? 'rgba(240,165,0,.08)' : 'transparent';
    btnEM.className = !isSurPlace ? 'btn btn-secondary' : 'btn btn-ghost';
    btnEM.style.borderColor = !isSurPlace ? 'var(--border-gold)' : 'var(--border)';
    btnEM.style.background = !isSurPlace ? 'rgba(240,165,0,.08)' : 'transparent';
  }
  const gt = document.getElementById('grpTable');
  if (gt) gt.style.display = isSurPlace ? 'flex' : 'none';
}

/* Écoute de la touche Entrée sur le modal panier */
document.getElementById('cartModal').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('sendOrderBtn').click();
  }
});

function init() {
  /* Apply theme color */
  document.documentElement.style.setProperty('--theme', buvette.themeColor || '#f0a500');

  /* Page title */
  document.title = `${buvette.name} — Menu`;

  /* Header */
  const lw = document.getElementById('mnLogoWrap');
  if (buvette.logo) lw.innerHTML = `<img src="${buvette.logo}" alt="${buvette.name}">`;
  else lw.innerHTML = `<span class="mn-logo-ph">${(buvette.name||'B')[0].toUpperCase()}</span>`;
  lw.style.background = buvette.logo ? 'transparent' : `linear-gradient(135deg,${buvette.themeColor||'#f0a500'},#e85d04)`;

  document.getElementById('mnName').textContent   = buvette.name;
  document.getElementById('mnSlogan').textContent = buvette.slogan || '';

  const infoItems = [];
  if (buvette.city)    infoItems.push(`📍 ${buvette.city}`);
  if (buvette.openTime && buvette.closeTime) infoItems.push(`🕐 ${buvette.openTime} – ${buvette.closeTime}`);
  if (buvette.phone)   infoItems.push(`📞 ${buvette.phone}`);
  document.getElementById('mnInfo').innerHTML = infoItems.map(i=>`<span class="mn-badge">${i}</span>`).join('');

  /* If there's a pending order, resume tracking */
  if (activeOrderId) {
    const order = ORDERS.getById(BID, activeOrderId);
    if (order && order.status !== 'expired') { showStatus(order); return; }
    else sessionStorage.removeItem(`apeiron_order_${BID}`);
  }

  // Show menu as soon as data is ready (short fade for UX polish)
  setTimeout(() => {
    document.getElementById('loader').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('menuMode').style.display = 'block';
      buildMenu();
    }, 400); // fade out
  }, 500);
}

/* ══ STATE ═══════════════════════════════════════════════ */
let cart = {}; 
let allProds = []; 

function updateAllProds() {
  const base = PRODUCTS.available(BID);
  const specials = allProds.filter(p => p.isSpecial);
  allProds = [...base, ...specials];
}

function cartTotal() {
  return Object.entries(cart).reduce((s,[pid,qty])=>{
    const p = allProds.find(x=>x.id===pid);
    return s + (p ? p.price*qty : 0);
  }, 0);
}
function cartCount() { return Object.values(cart).reduce((s,v)=>s+v,0); }

/* ══ BUILD MENU ══════════════════════════════════════════════ */
const CUR = buvette.currency || 'FCFA';

function renderSkeletons() {
  const tabs = document.getElementById('mnCatTabs');
  const container = document.getElementById('menuProducts');
  tabs.innerHTML = `<div class="skeleton sk-tab" style="height:90px;flex:1;"></div><div class="skeleton sk-tab" style="height:90px;flex:1;"></div>`;
  container.innerHTML = `
    <div class="client-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;padding:1rem;">
      <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
    </div>`;
}

let currentGroup = 'drinks';
let currentSubGroup = 'all';
let searchQuery  = '';
let specialTargetGroup = 'drinks';

function openSpecialModal(gid) {
  try {
    setSpecialType(gid || 'drinks');
    const txt = document.getElementById('specialText');
    if (txt) {
      txt.value = '';
      setTimeout(() => txt.focus(), 100);
    }
  } catch(e) {
    console.error("Special modal prep error:", e);
  }
  openModal('specialModal');
}

function setSpecialType(gid) {
  specialTargetGroup = gid;
  const sd = document.getElementById('segDrinks');
  const sf = document.getElementById('segFood');
  if (sd && sf) {
    sd.classList.toggle('active', gid === 'drinks');
    sf.classList.toggle('active', gid === 'food');
    
    // Aesthetic feedback
    sd.style.background = gid === 'drinks' ? 'rgba(255,255,255,0.1)' : 'transparent';
    sd.style.color = gid === 'drinks' ? '#fff' : 'rgba(255,255,255,0.4)';
    sf.style.background = gid === 'food' ? 'rgba(255,255,255,0.1)' : 'transparent';
    sf.style.color = gid === 'food' ? '#fff' : 'rgba(255,255,255,0.4)';
  }
}

function switchGroup(gid) {
  currentGroup = gid;
  currentSubGroup = 'all'; // Reset sub-filter when switching main tab
  document.querySelectorAll('.bi-tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById(`tab-${gid}`);
  if (tab) tab.classList.add('active');
  buildMenu(); // Rebuild sub-tabs too
}

function switchSubGroup(sid) {
  currentSubGroup = sid;
  document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById(`sub-${sid}`);
  if (tab) tab.classList.add('active');
  renderCurrentView();
}

function handleSearch() {
  searchQuery = document.getElementById('mnSearch').value.toLowerCase().trim();
  renderCurrentView();
}

function renderCurrentView() {
  updateAllProds();
  const container = document.getElementById('menuProducts');
  if (!container) return;

  const drinkIds = ['alcohol','soft','hot'];
  const foodIds  = ['food','dessert','other'];
  
  let prods = allProds.filter(p => {
    const isInCategory = (currentGroup === 'drinks') ? drinkIds.includes(p.category) : foodIds.includes(p.category);
    const matchesSub = (currentSubGroup === 'all') || (p.category === currentSubGroup);
    const matchesSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery) || (p.description||'').toLowerCase().includes(searchQuery);
    return isInCategory && matchesSub && matchesSearch;
  });

  container.innerHTML = `<div class="client-grid">` + (prods.length 
    ? prods.map((p, i) => prodCard(p, i)).join('') 
    : `<div style="grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--text-muted);">Aucun article trouvé</div>`) + `</div>`;
}

function addSpecialToCart() {
  const txt = document.getElementById('specialText');
  const text = txt ? txt.value.trim() : '';
  if (!text) { toast('Précisez votre souhait', 'warning'); return; }

  const sid = `sp_${Date.now()}`;
  // Use valid menu categories so the item is filterable if ever shown on the grid
  const specialItem = {
    id:        sid,
    name:      (specialTargetGroup === 'drinks' ? '🍹 ' : '🍴 ') + text,
    price:     0,
    category:  specialTargetGroup === 'drinks' ? 'alcohol' : 'food',
    type:      specialTargetGroup === 'drinks' ? 'drink'   : 'food',
    isSpecial: true,
  };

  allProds.push(specialItem);
  addToCart(sid);
  closeModal('specialModal');
  toast('Ajouté au panier ! ✨', 'success');
}

function buildMenu() {
  const availableProds = PRODUCTS.available(BID);
  
  const groups = {
    drinks: { label: 'Boissons', emoji: '🍹' },
    food:   { label: 'Nourriture', emoji: '🍔' }
  };

  const subGroups = {
    drinks: [
      { id: 'all', label: 'Tout' },
      { id: 'alcohol', label: 'Bières/Alcool' },
      { id: 'soft', label: 'Softs/Jus' },
      { id: 'hot', label: 'Chauds' }
    ],
    food: [
      { id: 'all', label: 'Tout' },
      { id: 'food', label: 'Plats' },
      { id: 'dessert', label: 'Desserts' },
      { id: 'other', label: 'Autres' }
    ]
  };

  /* Main Tabs */
  const tabs = document.getElementById('mnCatTabs');
  tabs.innerHTML = Object.entries(groups).map(([gid, g]) => `
    <div class="bi-tab ${gid===currentGroup?'active':''}" id="tab-${gid}" onclick="switchGroup('${gid}')">
      <span class="tab-icon">${g.emoji}</span>
      <span class="tab-label">${g.label}</span>
    </div>
  `).join('');

  /* Sub Tabs */
  const subTabs = document.getElementById('mnSubTabs');
  subTabs.innerHTML = subGroups[currentGroup].map(s => `
    <div class="sub-tab ${s.id===currentSubGroup?'active':''}" id="sub-${s.id}" onclick="switchSubGroup('${s.id}')">
      ${s.label}
    </div>
  `).join('');

  renderCurrentView();
}

function prodCard(p, i) {
  const outOfStock = p.stock === 0;
  const isAvail = p.available && !outOfStock;
  const delay = i * 0.05;
  const icon = (p.type==='drink' && p.brandId)
    ? `<div class="mn-cap">${DRINKS.svg(DRINKS.byId(p.brandId)||{id:'',lines:['?'],p:'#555',s:'#333',rim:'#888',t:'#fff'}, 62)}</div>`
    : p.imageData
      ? `<img class="mn-photo" src="${p.imageData}" alt="${p.name}">`
      : `<div style="width:62px;height:62px;border-radius:var(--r-sm);background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:2rem;">${p.category==='food'?'🍔':p.category==='dessert'?'🍰':'📦'}</div>`;
  return `
  <div class="mn-card ${isAvail?'':'unavail'}" id="mc-${p.id}" ${isAvail?`onclick="addToCart('${p.id}')"`:''} style="animation-delay: ${delay}s">
    <div class="mn-qty" id="qty-${p.id}"></div>
    ${icon}
    <div class="mn-pname">${p.name}</div>
    <div class="mn-pprice">${fmtPrice(p.price)}</div>
    ${p.description?`<div class="mn-pdesc">${p.description}</div>`:''}
    ${outOfStock ? `<div class="mn-pdesc" style="color:var(--error);font-weight:bold;margin-top:.3rem;">❌ Épuisé</div>` : ''}
  </div>`;
}

function fmtPrice(n) { return `${Number(n).toLocaleString('fr-FR')} ${CUR}`; }

/* ══ CAT SCROLL (kept for future use) ══ */
function scrollToSection(cid, tab) {
  if (tab) {
    document.querySelectorAll('.bi-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  }
  const sec = document.getElementById(`sec-${cid}`);
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══ CART ════════════════════════════════════════════════════ */
function addToCart(pid) {
  const p = allProds.find(x=>x.id===pid);
  if (p && p.stock !== '' && p.stock !== null && p.stock !== undefined && (cart[pid]||0) >= p.stock) {
    toast(`Désolé, il ne reste que ${p.stock} unité(s) au frais !`, 'warning');
    return;
  }
  cart[pid] = (cart[pid]||0) + 1;
  updateCartUI();
  const card = document.getElementById(`mc-${pid}`);
  if (card) {
    card.classList.add('in-cart');
    card.style.transform = 'scale(0.96)';
    setTimeout(()=>card.style.transform='',200);
  }
  // Pulse animation
  const bubble = document.getElementById('cartCount');
  bubble.style.transform='scale(1.3)';
  setTimeout(()=>bubble.style.transform='',200);
}

function updateCartUI() {
  const total = cartTotal();
  const count = cartCount();
  const bar   = document.getElementById('cartBar');
  bar.classList.toggle('vis', count > 0);
  document.getElementById('fabSpecial').classList.toggle('cart-up', count > 0);
  document.getElementById('mnSearchWrap').classList.toggle('cart-up', count > 0);
  document.getElementById('cartCount').textContent       = count;
  document.getElementById('cartTotalDisplay').textContent = fmtPrice(total);
  document.getElementById('cartItemsLbl').textContent    = count>1?`${count} articles`:`${count} article`;

  /* Update qty badges on cards */
  Object.entries(cart).forEach(([pid,qty]) => {
    const badge = document.getElementById(`qty-${pid}`);
    if (badge) { badge.textContent=qty; badge.classList.toggle('show', qty>0); }
    const card  = document.getElementById(`mc-${pid}`);
    if (card) card.classList.toggle('in-cart', qty>0);
  });
  /* Clear removed items */
  allProds.forEach(p => {
    if (!cart[p.id] || cart[p.id]===0) {
      const badge = document.getElementById(`qty-${p.id}`);
      if (badge) { badge.textContent=''; badge.classList.remove('show'); }
      const card  = document.getElementById(`mc-${p.id}`);
      if (card) card.classList.remove('in-cart');
    }
  });
}

function openCart() {
  const items = Object.entries(cart).filter(([,qty])=>qty>0);
  if (!items.length) return;

  /* Cart item list */
  document.getElementById('cartItemList').innerHTML = items.map(([pid,qty])=>{
    const p = allProds.find(x=>x.id===pid);
    if (!p) return '';
    const icon = (p.type==='drink' && p.brandId)
      ? `<div class="cart-item-cap">${DRINKS.svg(DRINKS.byId(p.brandId)||{id:'',lines:['?'],p:'#555',s:'#333',rim:'#888',t:'#fff'},40)}</div>`
      : p.imageData
        ? `<img class="cart-item-photo" src="${p.imageData}" alt="${p.name}">`
        : `<div style="width:40px;height:40px;border-radius:6px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">${p.category==='food'?'🍔':'📦'}</div>`;
    return `
    <div class="cart-item-row" id="ci-${pid}">
      ${icon}
      <div class="cart-item-name">${p.name}</div>
      <div class="qty-ctrl">
        <div class="qty-btn" onclick="changeQty('${pid}',-1)">−</div>
        <div class="qty-num">${qty}</div>
        <div class="qty-btn" onclick="changeQty('${pid}',1)">+</div>
      </div>
      <div class="cart-item-price">${fmtPrice(p.price*qty)}</div>
    </div>`;
  }).join('');

  document.getElementById('cartModalTotal').textContent = fmtPrice(cartTotal());
  document.getElementById('orderErr').classList.remove('show');
  openModal('cartModal');
}

function changeQty(pid, delta) {
  if (delta > 0) {
    const p = allProds.find(x=>x.id===pid);
    if (p && p.stock !== '' && p.stock !== null && p.stock !== undefined && (cart[pid]||0) >= p.stock) {
      toast(`Désolé, stock limite atteint (${p.stock})`, 'warning');
      return;
    }
  }

  cart[pid] = Math.max(0, (cart[pid]||0)+delta);
  if (cart[pid]===0) delete cart[pid];

  /* Refresh row */
  const row = document.getElementById(`ci-${pid}`);
  if (row && (!cart[pid]||cart[pid]===0)) { row.remove(); }
  else if (row) {
    row.querySelector('.qty-num').textContent = cart[pid];
    const p = allProds.find(x=>x.id===pid);
    row.querySelector('.cart-item-price').textContent = p ? fmtPrice(p.price*cart[pid]) : '';
  }

  document.getElementById('cartModalTotal').textContent = fmtPrice(cartTotal());
  updateCartUI();

  if (cartCount()===0) closeModal('cartModal');
}

async function sendOrder() {
  const name = document.getElementById('clientName').value.trim();
  if (!name) {
    document.getElementById('orderErr').textContent='Votre prénom est requis.';
    document.getElementById('orderErr').classList.add('show');
    return;
  }
  let tInfo = '';
  if (orderMode === 'Sur Place') {
    const tab = document.getElementById('clientTable').value.trim();
    if (!tab) { document.getElementById('orderErr').textContent='Le numéro de table est requis pour du Sur Place.'; document.getElementById('orderErr').classList.add('show'); return; }
    tInfo = `Sur Place (Table: ${tab})`;
  } else {
    tInfo = `À emporter`;
  }

  const items = Object.entries(cart)
    .filter(([,qty])=>qty>0)
    .map(([pid,qty])=>{
      const p = allProds.find(x=>x.id===pid);
      return { productId:pid, name:p.name, qty, price:p.price };
    });

  const btn = document.getElementById('sendOrderBtn');
  btn.disabled=true; btn.textContent='Envoi en cours…';

  const order = await ORDERS.create(BID, {
    clientName: name,
    tableInfo:  tInfo,
    items,
  });

  /* Store order id in session */
  sessionStorage.setItem(`apeiron_order_${BID}`, order.id);
  activeOrderId = order.id;
  cart = {};
  updateCartUI();
  closeModal('cartModal');
  showStatus(order);
  btn.disabled=false; btn.textContent='🚀 Envoyer la commande';
}

/* ══ ORDER STATUS PAGE ════════════════════════════════════════ */
let pollTimer = null;

function showStatus(order) {
  document.getElementById('loader').style.display  = 'none';
  document.getElementById('menuMode').style.display = 'none';
  document.getElementById('statusMode').style.display = 'block';
  renderStatus(order);

  /* Subscribe to order updates in real-time */
  ORDERS.listen(BID, (allOrders) => {
    const fresh = allOrders.find(o => o.id === order.id);
    if (fresh) {
      renderStatus(fresh);
      if (fresh.status === 'paid') {
        // Optionnel: confetti or something
      }
    }
  });
}

function renderStatus(order) {
  const map = {
    pending:   { icon:'⏳', cls:'status-pending',   title:'Commande reçue !',      sub:'Votre commande est en attente de confirmation.' },
    preparing: { icon:'👨‍🍳', cls:'status-preparing', title:'En cours de service !',      sub:'Le serveur exécute votre commande. Elle arrive !' },
    paid:      { icon:'✅', cls:'status-paid',       title:'Commande payée ! 🎉',   sub:'Votre paiement a été confirmé. Vous pouvez télécharger votre ticket.' },
  };
  const s = map[order.status] || map.pending;

  const anim = document.getElementById('sAnim');
  anim.textContent = s.icon;
  anim.className   = `status-anim ${s.cls}`;

  document.getElementById('sTitle').textContent = s.title;
  document.getElementById('sNum').textContent   = order.orderNumber;
  document.getElementById('sSub').innerHTML     = `${s.sub}<br><span class="s-order-num">${order.orderNumber}</span>`;

  /* Items recap */
  const cur = buvette.currency || 'FCFA';
  document.getElementById('sRecap').innerHTML =
    order.items.map(it=>`<div class="s-item-line"><span>${it.qty}× ${it.name}</span><span>${Number(it.price*it.qty).toLocaleString('fr-FR')} ${cur}</span></div>`).join('') +
    `<div class="s-total"><span>Total</span><span style="color:var(--theme);">${Number(order.total).toLocaleString('fr-FR')} ${cur}</span></div>`;

  /* Actions */
  const actions = document.getElementById('sActions');
  if (order.status === 'paid') {
    actions.innerHTML = `<button class="btn dl-btn btn-lg" onclick="downloadTicket('${order.id}')">🎫 Télécharger mon ticket PDF</button>`;
  } else {
    actions.innerHTML = `<div style="display:flex;align-items:center;gap:.5rem;color:var(--text-muted);font-size:.84rem;"><div class="spinner" style="width:18px;height:18px;border-width:2px;"></div> Suivi en temps réel…</div>`;
  }
}

function downloadTicket(oid) {
  const order = ORDERS.getById(BID, oid);
  if (!order) return;
  if (typeof PDF !== 'undefined') {
    PDF.generate(buvette, order);
  } else {
    toast("Erreur de chargement du module PDF", "error");
  }
}

function backToMenu() {
  clearInterval(pollTimer);
  sessionStorage.removeItem(`apeiron_order_${BID}`);
  activeOrderId = null;
  document.getElementById('statusMode').style.display = 'none';
  document.getElementById('menuMode').style.display   = 'block';
}

/* ══ UTILS ══ */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toast(msg,type='info') {
  const icons={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;
  t.innerHTML=`<span>${icons[type]}</span><span class="toast-msg">${msg}</span>`;
  document.getElementById('toastBox').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},3500);
}
</script>
