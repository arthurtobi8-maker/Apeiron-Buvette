# Netlify configuration — Apeiron Buvette (React + Vite)
# Option A : Glissez-déposez le dossier "dist" sur https://app.netlify.com/drop
# Option B : Liez votre dépôt Git avec les paramètres ci-dessous

[build]
  command = "npm run build"
  publish = "dist"

# Cache static assets from Vite aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
