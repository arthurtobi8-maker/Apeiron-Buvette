<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Clés de Licence - Apeiron Buvette</title>
    <style>
        :root {
            --bg: #0b0c10;
            --bg-card: #1f2833;
            --theme: #f0a500;
            --theme-glow: rgba(240, 165, 0, 0.15);
            --text: #c5c6c7;
            --text-title: #ffffff;
            --border: #45f3ff;
            --border-gold: rgba(240, 165, 0, 0.25);
            --r-md: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            background: var(--bg-card);
            border-radius: var(--r-md);
            border: 1px solid var(--border-gold);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 15px var(--theme-glow);
            text-align: center;
        }

        h1 {
            color: var(--text-title);
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            color: var(--theme);
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 0.85rem;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--theme);
            box-shadow: 0 0 8px var(--theme-glow);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--theme);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: 0.3s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: #ffb703;
            box-shadow: 0 0 15px var(--theme-glow);
        }

        .result-box {
            margin-top: 2rem;
            padding: 1.25rem;
            background: #111;
            border-radius: 8px;
            border: 1px dashed var(--theme);
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-lbl {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .result-key {
            font-family: monospace;
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.05em;
            word-break: break-all;
            user-select: all;
        }

        .btn-copy {
            margin-top: 0.75rem;
            background: transparent;
            border: 1px solid var(--theme);
            color: var(--theme);
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-copy:hover {
            background: var(--theme);
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔑 Générateur de Licence</h1>
    <p class="subtitle">Apeiron Buvette — Administration Centrale</p>

    <div class="form-group">
        <label for="buvetteId">ID de l'établissement</label>
        <input type="text" id="buvetteId" placeholder="Ex: moe8e5re7gmuqpunv" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="planType">Formule à activer</label>
        <select id="planType">
            <option value="Pro">Pro (10 000 FCFA / mois)</option>
            <option value="Ultimate">Ultimate (25 000 FCFA / mois)</option>
        </select>
    </div>

    <button class="btn" onclick="generateKey()">Générer la Clé</button>

    <div class="result-box" id="resultBox">
        <div class="result-lbl">Clé d'activation générée :</div>
        <div class="result-key" id="resultKey">PRO-XXXX-YYYY</div>
        <button class="btn-copy" onclick="copyKey()" id="copyBtn">Copier la clé</button>
    </div>
</div>

<script>
    function generateKey() {
        const idInput = document.getElementById('buvetteId').value.trim();
        const plan = document.getElementById('planType').value;
        
        if (!idInput) {
            alert('Veuillez renseigner l\'ID de l\'établissement.');
            return;
        }

        const secretSalt = "ApeironBuvetteSecret2026";
        const input = `${idInput}-${plan}-${secretSalt}`;
        
        // Custom hashing algorithm matching verification logic
        let hash = 0;
        for (let i = 0; i < input.length; i++) {
            const char = input.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; // Convert to 32bit integer
        }

        const positiveHash = Math.abs(hash);
        const base36 = positiveHash.toString(36).toUpperCase().padStart(8, '0');
        const generatedCode = `${plan.toUpperCase()}-${base36.slice(0, 4)}-${base36.slice(4, 8)}`;

        document.getElementById('resultKey').innerText = generatedCode;
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('copyBtn').innerText = 'Copier la clé';
    }

    function copyKey() {
        const keyText = document.getElementById('resultKey').innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            document.getElementById('copyBtn').innerText = 'Clé copiée ! ✓';
        }).catch(err => {
            alert('Erreur lors de la copie de la clé.');
        });
    }
</script>

</body>
</html>
